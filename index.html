<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe9f1" id="themeColor">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1:#ffe9f1; --bg2:#fff3d1; --text:#43304a; --muted:#7a6683; --card:rgba(255,255,255,.58);
    --yes-bg:#b6ecc9; --yes-text:#0f3d27; --no-bg:#ffc2cf; --no-text:#5a1230;
    --body-font:"Quicksand",ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;
    --display-font:"Quicksand",ui-rounded,-apple-system,sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg1); }
  body { margin:0; min-height:100vh; color:var(--text); font-family:var(--body-font);
         background:transparent;
         padding:max(22px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
         }
  main { max-width:480px; margin:0 auto; position:relative; z-index:1; }
  #bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(120deg,var(--bg1),var(--bg2),var(--bg1)); background-size:300% 300%; animation:drift 28s ease-in-out infinite; }
  #fx { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .star { position:absolute; border-radius:50%; background:#fff; box-shadow:0 0 6px #d9c8ff; opacity:.1; animation:twinkle 9s ease-in-out infinite; }
  .drop { position:absolute; top:0; width:2px; height:16px; border-radius:2px; background:var(--drop); opacity:0; animation:fall 3s linear infinite; }
  @keyframes drift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @keyframes twinkle { 0%,100%{opacity:.1; transform:scale(.7)} 50%{opacity:1; transform:scale(1.2)} }
  @keyframes fall { 0%{transform:translateY(-30px); opacity:0} 15%{opacity:.8} 100%{transform:translateY(105vh); opacity:0} }
  @media (prefers-reduced-motion: reduce) { #bg, .star, .drop { animation:none !important; } .drop { display:none; } .star { opacity:.6; } }
  .place { color:var(--muted); font-size:15px; font-weight:600; letter-spacing:.02em; }
  .hero { display:flex; align-items:flex-end; justify-content:space-between; }
  .temp { font-family:var(--display-font); font-size:92px; font-weight:300; line-height:1; margin:4px 0 2px; }
  .icon { font-size:64px; line-height:1; padding-bottom:10px; }
  .cond { font-size:19px; font-weight:600; }
  .feels { color:var(--muted); font-size:14px; margin-top:2px; }

  .apps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:18px; }
  .app { display:block; text-align:center; text-decoration:none; color:var(--text); background:var(--card); border-radius:16px; padding:10px 4px 8px; -webkit-tap-highlight-color:transparent; }
  .app .ai { font-size:22px; line-height:1.2; display:block; }
  .app .an { font-size:12px; font-weight:600; display:block; margin-top:3px; }
  .app.empty { background:none; border:1.5px dashed var(--muted); color:var(--muted); opacity:.8; }
  .app:active:not(.empty) { transform:scale(.97); }
  .app[role="button"] { cursor:pointer; }

  .wtile { position:relative; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .wmini { display:block; height:3px; border-radius:2px; background:rgba(122,102,131,.25); margin:6px 8px 0; }
  .wmini span { display:block; height:100%; border-radius:2px; background:#d4537e; width:0; transition:width .5s ease-out; }
  .wdrop { position:absolute; left:calc(50% - 4px); top:-4px; width:8px; height:11px; background:#d4537e; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; opacity:0; pointer-events:none; }
  .wrip { position:absolute; left:calc(50% - 14px); top:12px; width:28px; height:28px; border-radius:50%; border:1.5px solid #d4537e; opacity:0; pointer-events:none; }
  .wdrop.go { animation:wfall .5s ease-in; }
  .wrip.go { animation:wrip .6s .3s ease-out; }
  .wtile .ai.pop { animation:wpop .35s .3s ease-out; }
  @keyframes wfall { 0%{opacity:0; transform:translateY(0)} 15%{opacity:1} 80%{opacity:1; transform:translateY(20px)} 100%{opacity:0; transform:translateY(26px) scale(.3)} }
  @keyframes wrip { 0%{opacity:.7; transform:scale(.3)} 100%{opacity:0; transform:scale(1.6)} }
  @keyframes wpop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  @media (prefers-reduced-motion: reduce) { .wdrop.go, .wrip.go, .wtile .ai.pop { animation:none; } .wmini span { transition:none; } }
  .wk { margin-top:14px; }
  .wk summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); padding:4px 0; }
  .wbars { display:flex; gap:6px; align-items:flex-end; height:76px; margin-top:12px; }
  .wbars > div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; height:100%; }
  .wbars .wb { width:100%; border-radius:4px 4px 0 0; background:rgba(212,83,126,.35); }
  .wbars .wb.today { background:#d4537e; }
  .wbars .wd { font-size:11px; color:var(--muted); font-weight:600; }
  .wbars .wv { font-size:11px; font-weight:600; }
  .wundo { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; color:var(--muted); font-weight:600; }
  .wbtn { padding:8px 14px; border-radius:12px; font-size:13px; font-weight:600; text-decoration:none; color:var(--text); background:rgba(255,255,255,.55); border:1px solid rgba(122,102,131,.25); cursor:pointer; }

  .section { margin-top:26px; }
  .section h2 { margin:0 0 2px; font-size:20px; font-weight:700; }
  .section .sub { color:var(--muted); font-size:13px; margin-bottom:10px; font-weight:500; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border-radius:22px; padding:14px 14px 15px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .tile .label { font-size:13px; font-weight:600; color:var(--muted); }
  .pill { display:inline-block; margin:8px 0 8px; padding:7px 14px; border-radius:999px; font-size:19px; font-weight:700; line-height:1.15; }
  .pill.yes { background:var(--yes-bg); color:var(--yes-text); }
  .pill.no { background:var(--no-bg); color:var(--no-text); }
  .tile .why { font-size:12.5px; line-height:1.35; color:var(--muted); font-weight:500; }

  .bd-head { display:flex; justify-content:space-between; align-items:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .bd-head .sub { margin-bottom:0; }
  .chev { width:26px; height:26px; color:var(--muted); transition:transform .25s; flex:none; }
  .chev.up { transform:rotate(180deg); }
  .bd-panel { overflow:hidden; max-height:0; transition:max-height .35s ease; }
  .bd-panel.open { max-height:260px; }
  .hours { display:flex; gap:8px; overflow-x:auto; padding:10px 2px 8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .hours::-webkit-scrollbar { display:none; }
  .hr { flex:0 0 62px; background:var(--card); border-radius:18px; padding:10px 4px; text-align:center; font-size:14px; font-weight:600; }
  .hr .t { color:var(--muted); font-size:12px; }
  .hr .ic { font-size:22px; margin:6px 0 4px; }
  .hr .r { color:var(--muted); font-size:12px; margin-top:2px; }

  .week { margin-top:28px; background:var(--card); border-radius:22px; padding:12px 16px; }
  .week h3 { margin:2px 0 6px; font-size:13px; font-weight:600; color:var(--muted); }
  .row { display:grid; grid-template-columns:58px 28px 1fr auto; align-items:center; gap:6px; padding:5px 0; font-size:14px; font-weight:600; }
  .row .rain { color:var(--muted); font-size:12px; font-weight:600; }
  .row .range { text-align:right; font-variant-numeric:tabular-nums; }
  .row .range span { color:var(--muted); font-weight:500; }

  .foot { margin-top:22px; font-size:12px; color:var(--muted); text-align:center; line-height:1.9; }
  a { color:var(--text); font-weight:600; }
  button { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; font-size:12px; padding:2px 6px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="fx"></div>
<main>
  <div class="place" id="place">Finding you...</div>
  <div class="hero">
    <div>
      <div class="temp" id="temp">--</div>
      <div class="cond" id="cond"></div>
      <div class="feels" id="feels"></div>
    </div>
    <div class="icon" id="icon"></div>
  </div>

  <div class="apps">
    <a class="app" href="shortcuts://run-shortcut?name=Tram"><span class="ai">🚋</span><span class="an">Tram</span></a>
    <a class="app" href="shortcuts://run-shortcut?name=Health"><span class="ai">🩷</span><span class="an">Health</span></a>
    <a class="app" href="shortcuts://run-shortcut?name=Upcoming%20Classes"><span class="ai">🧘</span><span class="an">Classes</span></a>
    <div class="app wtile" id="waterTile" role="button" tabindex="0" aria-label="Log one water refill"><span class="wdrop" id="wDrop"></span><span class="wrip" id="wRip"></span><span class="ai">💧</span><span class="an" id="waterTileText">0 / 3 L</span><span class="wmini"><span id="wMini"></span></span></div>
  </div>

  <div id="sections"></div>
  <div class="week" id="week" hidden><h3>Next 7 days</h3><div id="weekRows"></div></div>

  <details class="week wk" id="waterWeek">
    <summary>Water this week</summary>
    <div class="wbars" id="wBars"></div>
    <div class="wundo"><span id="wTodayTxt"></span><button class="wbtn" id="wSub" type="button">-1 today</button></div>
  </details>

  <div class="foot">
    <div id="updated"></div>
    <div><button id="refresh">Refresh</button><button id="reloc">Reset location</button></div>
    <div><a id="bomLink" href="https://www.bom.gov.au/" target="_blank" rel="noopener">Official BoM forecast</a></div>
    <div>Forecast data: Open-Meteo, which combines national weather service models.</div>
  </div>
</main>

<script>
// ---- Settings you can tweak ----
const FALLBACK = { name: "Melbourne", lat: -37.8136, lon: 144.9631 };
const RAIN_CHANCE = 30;         // % chance that triggers a raincoat
const RAIN_MM = 1;              // mm in any single hour that triggers a raincoat
const LAYER_BELOW = 18;         // "feels like" under this (C) means layers
const SWING = 8;                // temperature swing (C) that means layers
const DAY_START = 7, DAY_END = 21; // hours used for tomorrow (7am to 9pm)

const CODES = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
  56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
  71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
  95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};

// Colour palettes: [top, bottom, light text?]  by time of day and weather
const PALETTES = {
  day:  { clear:["#ffe9f1","#fff3d1",0], cloud:["#efe9f7","#f8f1f4",0], rain:["#d9e8f7","#eadcf6",0], storm:["#5b5287","#8a7aae",1] },
  dawn: { clear:["#ffd8c9","#ffc4dc",0], cloud:["#f3d9e3","#e6d7f0",0], rain:["#d4d9ee","#e9d3e6",0], storm:["#5f5388","#9a7aa8",1] },
  dusk: { clear:["#ffb9a6","#d7a8ee",0], cloud:["#e9b9c9","#c6b2e3",0], rain:["#aeb3e0","#d3a9d9",0], storm:["#4c4478","#8a6a9e",1] },
  night:{ clear:["#2b2557","#52408a",1], cloud:["#2e2c56","#46467a",1], rain:["#232d55","#3d4f85",1], storm:["#1d1b3c","#3a3166",1] }
};

const $ = id => document.getElementById(id);
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }

function weatherKind(code) {
  if (code >= 95) return "storm";
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 86)) return "rain";
  if (code === 2 || code === 3 || code === 45 || code === 48) return "cloud";
  return "clear";
}
function iconFor(code, night) {
  if (code >= 95) return "⛈️";
  if (code >= 80 && code <= 82) return "🌦️";
  if ((code >= 51 && code <= 67)) return "🌧️";
  if (code >= 71 && code <= 86) return "🌨️";
  if (code === 45 || code === 48) return "🌫️";
  if (code === 3) return "☁️";
  if (code === 2) return night ? "☁️" : "⛅";
  return night ? "🌙" : "☀️";
}

function phaseOf(nowStr, sunriseStr, sunsetStr) {
  const t = Date.parse(nowStr), sr = Date.parse(sunriseStr), ss = Date.parse(sunsetStr), m = 60000;
  if (t < sr - 45 * m || t > ss + 45 * m) return "night";
  if (t < sr + 75 * m) return "dawn";
  if (t > ss - 75 * m) return "dusk";
  return "day";
}

let fxKind = "";
function setFx(kind) {
  if (kind === fxKind) return;
  fxKind = kind;
  const r = (a, b) => a + Math.random() * (b - a);
  let h = "";
  if (kind === "stars") {
    for (let i = 0; i < 26; i++) {
      const sz = r(2, 4.5).toFixed(1);
      h += '<span class="star" style="left:' + r(0, 98).toFixed(1) + '%;top:' + r(0, 98).toFixed(1) + '%;width:' + sz + 'px;height:' + sz + 'px;animation-duration:' + r(8, 13).toFixed(1) + 's;animation-delay:-' + r(0, 12).toFixed(1) + 's"></span>';
    }
  } else if (kind === "rain") {
    for (let i = 0; i < 18; i++) {
      h += '<span class="drop" style="left:' + r(0, 98).toFixed(1) + '%;animation-duration:' + r(2.2, 3.8).toFixed(1) + 's;animation-delay:-' + r(0, 4).toFixed(1) + 's"></span>';
    }
  }
  $("fx").innerHTML = h;
}

function applyTheme(phase, kind) {
  const p = PALETTES[phase][kind], light = p[2] === 1, r = document.documentElement.style;
  r.setProperty("--bg1", p[0]); r.setProperty("--bg2", p[1]);
  r.setProperty("--text", light ? "#fbf4ff" : "#43304a");
  r.setProperty("--muted", light ? "#d3c6ea" : "#7a6683");
  r.setProperty("--drop", light ? "rgba(255,255,255,.4)" : "rgba(110,140,200,.5)");
  r.setProperty("--card", light ? "rgba(255,255,255,.13)" : "rgba(255,255,255,.58)");
  const serif = (phase === "dawn" || phase === "dusk");
  r.setProperty("--display-font", serif ? '"Fraunces",Georgia,serif' : '"Quicksand",ui-rounded,-apple-system,sans-serif');
  $("themeColor").setAttribute("content", p[0]);
}

function getPosition() {
  return new Promise(resolve => {
    const saved = store("loc");
    if (saved) { try { return resolve(JSON.parse(saved)); } catch (e) {} }
    if (!navigator.geolocation) return resolve(FALLBACK);
    navigator.geolocation.getCurrentPosition(
      p => { const loc = { name: "Your location", lat: p.coords.latitude, lon: p.coords.longitude }; store("loc", JSON.stringify(loc)); resolve(loc); },
      () => resolve(FALLBACK), { timeout: 8000, maximumAge: 3600000 });
  });
}

async function load() {
  const loc = await getPosition();
  $("place").textContent = loc.name;
  $("bomLink").href = loc.name === "Melbourne" ? "https://www.bom.gov.au/vic/forecasts/melbourne.shtml" : "https://www.bom.gov.au/";
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + loc.lat + "&longitude=" + loc.lon +
    "&current=temperature_2m,apparent_temperature,weather_code" +
    "&hourly=apparent_temperature,precipitation_probability,precipitation,weather_code,is_day" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
    "&timezone=auto&forecast_days=7";
  try {
    const d = await (await fetch(url)).json();
    if (!d.current || !d.hourly || !d.daily) throw new Error("bad data");
    render(d);
  } catch (e) {
    $("cond").textContent = "Could not load the weather. Check your connection and tap Refresh.";
  }
}

// Work out the raincoat and layers answers for a slice of the hourly data
function advice(h, s, e) {
  const prob = h.precipitation_probability.slice(s, e).filter(v => v != null);
  const mm = h.precipitation.slice(s, e).filter(v => v != null);
  const feel = h.apparent_temperature.slice(s, e).filter(v => v != null);
  if (!feel.length) return null;
  const maxProb = prob.length ? Math.max(...prob) : 0, maxMm = mm.length ? Math.max(...mm) : 0;
  const lo = Math.min(...feel), hi = Math.max(...feel);
  return { rain: maxProb >= RAIN_CHANCE || maxMm >= RAIN_MM, maxProb, maxMm, lo, hi, layers: lo < LAYER_BELOW || (hi - lo) >= SWING };
}

function tiles(a) {
  if (!a) return '<div class="sub">No forecast available for this window.</div>';
  const rainWhy = "Up to " + a.maxProb + "% chance of rain" + (a.maxMm > 0 ? ", up to " + a.maxMm.toFixed(1) + " mm an hour." : ".");
  const layerWhy = "Feels like " + Math.round(a.lo) + "° to " + Math.round(a.hi) + "°.";
  return '<div class="tiles">' +
    '<div class="tile"><div class="label">Raincoat?</div><div class="pill ' + (a.rain ? "yes" : "no") + '">' + (a.rain ? "Yes, bring it" : "No, leave it") + '</div><div class="why">' + rainWhy + '</div></div>' +
    '<div class="tile"><div class="label">Layers?</div><div class="pill ' + (a.layers ? "yes" : "no") + '">' + (a.layers ? "Yes, pack" : "No, skip") + '</div><div class="why">' + layerWhy + '</div></div>' +
    '</div>';
}

let bdOpen = false;

function toggleBreakdown(t) {
  bdOpen = !bdOpen;
  $("bdPanel").classList.toggle("open", bdOpen);
  t.setAttribute("aria-expanded", bdOpen);
  t.querySelector(".chev").classList.toggle("up", bdOpen);
}
document.addEventListener("click", e => { const t = e.target.closest("[data-toggle]"); if (t) toggleBreakdown(t); });
document.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest("[data-toggle]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleBreakdown(t); }
});

function render(d) {
  const c = d.current, h = d.hourly, day = d.daily;
  const hourNow = parseInt(c.time.slice(11, 13), 10);
  const phase = phaseOf(c.time, day.sunrise[0], day.sunset[0]);
  const night = phase === "night";
  const wkind = weatherKind(c.weather_code);
  applyTheme(phase, wkind);
  setFx((wkind === "rain" || wkind === "storm") ? "rain" : (night ? "stars" : ""));

  $("temp").textContent = Math.round(c.temperature_2m) + "°";
  $("cond").textContent = CODES[c.weather_code] || "";
  $("feels").textContent = "Feels like " + Math.round(c.apparent_temperature) + "°";
  $("icon").textContent = iconFor(c.weather_code, night);

  // Today: from this hour until 9pm (at least the next 3 hours)
  const nowKey = c.time.slice(0, 13) + ":00";
  const s0 = Math.max(0, h.time.findIndex(t => t >= nowKey));
  let e0 = h.time.indexOf(day.time[0] + "T" + String(DAY_END).padStart(2, "0") + ":00") + 1;
  if (e0 - s0 < 3) e0 = s0 + 3;
  // Before 5am, Today means the coming day, so look at its daytime (7am to 9pm)
  const earlyHours = hourNow < 5;
  const sT = earlyHours ? Math.max(0, h.time.indexOf(day.time[0] + "T" + String(DAY_START).padStart(2, "0") + ":00")) : s0;
  const today = advice(h, sT, e0);

  // Tomorrow: 7am to 9pm
  const s1 = h.time.indexOf(day.time[1] + "T" + String(DAY_START).padStart(2, "0") + ":00");
  const e1 = h.time.indexOf(day.time[1] + "T" + String(DAY_END).padStart(2, "0") + ":00") + 1;
  const tomorrow = s1 >= 0 ? advice(h, s1, e1) : null;

  const todaySec = '<div class="section"><h2>Today</h2><div class="sub">' +
    (earlyHours ? "7am to 9pm" : hourNow >= DAY_END - 3 ? "The next few hours" : "From now until 9pm") + '</div>' + tiles(today) + '</div>';
  const tomSec = '<div class="section"><h2>Tomorrow</h2><div class="sub">' +
    (CODES[day.weather_code[1]] || "") + ", " + Math.round(day.temperature_2m_min[1]) + "° to " + Math.round(day.temperature_2m_max[1]) + "° · 7am to 9pm" + '</div>' + tiles(tomorrow) + '</div>';
  // Breakdown: next 24 hours, scrolls sideways
  const CHEV = '<svg class="chev' + (bdOpen ? " up" : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  let cols = "";
  for (let i = s0; i < Math.min(s0 + 24, h.time.length); i++) {
    const hr = parseInt(h.time[i].slice(11, 13), 10);
    const label = i === s0 ? "Now" : (hr === 0 ? "12am" : hr < 12 ? hr + "am" : hr === 12 ? "12pm" : (hr - 12) + "pm");
    const pr = h.precipitation_probability[i];
    cols += '<div class="hr"><div class="t">' + label + '</div><div class="ic">' + iconFor(h.weather_code[i], h.is_day[i] === 0) + '</div><div>' +
      Math.round(h.apparent_temperature[i]) + '°</div><div class="r">' + (pr != null ? pr + "%" : "") + '</div></div>';
  }
  const bdSec = '<div class="section"><div class="bd-head" data-toggle role="button" tabindex="0" aria-expanded="' + bdOpen + '"><div><h2>Breakdown</h2><div class="sub">Next 24 hours, swipe sideways. Feels like temperature and rain chance.</div></div>' + CHEV + '</div>' +
    '<div class="bd-panel' + (bdOpen ? " open" : "") + '" id="bdPanel"><div class="hours">' + cols + '</div></div></div>';

  // Order of sections by time of day (minutes after midnight)
  const mins = hourNow * 60 + parseInt(c.time.slice(14, 16), 10);
  let order;
  if (mins >= 20 * 60) order = [tomSec, bdSec, todaySec];            // 8pm to midnight
  else if (mins >= 15.5 * 60) order = [todaySec, bdSec, tomSec];     // 3:30pm to 8pm
  else if (mins >= 9.5 * 60) order = [bdSec, todaySec, tomSec];      // 9:30am to 3:30pm
  else order = [todaySec, bdSec, tomSec];                            // midnight to 9:30am
  $("sections").innerHTML = order.join("");

  // 7 day forecast
  let rows = "";
  for (let i = 0; i < day.time.length; i++) {
    const name = i === 0 ? "Today" : new Date(day.time[i] + "T12:00:00").toLocaleDateString("en-AU", { weekday: "short" });
    rows += '<div class="row"><div>' + name + '</div><div>' + iconFor(day.weather_code[i], false) + '</div>' +
      '<div class="rain">' + (day.precipitation_probability_max[i] != null ? day.precipitation_probability_max[i] + "%" : "") + '</div>' +
      '<div class="range">' + Math.round(day.temperature_2m_max[i]) + '° <span>' + Math.round(day.temperature_2m_min[i]) + '°</span></div></div>';
  }
  $("weekRows").innerHTML = rows;
  $("week").hidden = false;

  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

// ---- Water tracker ----
// Counts are saved on this phone only (localStorage), never sent anywhere.
const WATER_GOAL_L = 3;            // daily goal in litres
const BOTTLE_L = 1;                // size of one refill in litres
const LOG_TO_HEALTH = false;       // set to true once the iPhone Shortcut below exists
const WATER_SHORTCUT = "Log Water";

function dayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function waterData() { try { return JSON.parse(store("water") || "{}") || {}; } catch (e) { return {}; } }
function waterSave(o) {
  const keys = Object.keys(o).sort();
  while (keys.length > 30) delete o[keys.shift()];
  store("water", JSON.stringify(o));
}
const litres = n => Number((n * BOTTLE_L).toFixed(1));

function drawWater() {
  const data = waterData(), n = data[dayKey()] || 0, L = litres(n);
  $("waterTileText").textContent = L + " / " + WATER_GOAL_L + " L";
  $("wMini").style.width = Math.min(L / WATER_GOAL_L, 1) * 100 + "%";
  $("wTodayTxt").textContent = n + (n === 1 ? " refill today" : " refills today");
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const top = Math.max(WATER_GOAL_L, ...days.map(d => litres(data[dayKey(d)] || 0)));
  $("wBars").innerHTML = days.map((d, i) => {
    const v = litres(data[dayKey(d)] || 0);
    return '<div><span class="wv">' + (v || "") + '</span><span class="wb' + (i === 6 ? " today" : "") + '" style="height:' + Math.max(2, v / top * 44) + 'px"></span><span class="wd">' +
      (i === 6 ? "Today" : d.toLocaleDateString("en-AU", { weekday: "short" })) + '</span></div>';
  }).join("");
}
function play(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function addRefill() {
  const data = waterData(), k = dayKey();
  data[k] = (data[k] || 0) + 1;
  waterSave(data); drawWater();
  play($("wDrop"), "go"); play($("wRip"), "go"); play($("waterTile").querySelector(".ai"), "pop");
  if (LOG_TO_HEALTH) setTimeout(() => { location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(WATER_SHORTCUT); }, 1000);
}
$("waterTile").onclick = addRefill;
$("waterTile").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); addRefill(); } };
$("wSub").onclick = () => {
  const data = waterData(), k = dayKey();
  if ((data[k] || 0) > 0) { data[k]--; waterSave(data); drawWater(); }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) drawWater(); });
drawWater();

$("refresh").onclick = load;
$("reloc").onclick = () => { store("loc", null); load(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
